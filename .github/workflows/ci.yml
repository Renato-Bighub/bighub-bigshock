name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: bigstock, POSTGRES_PASSWORD: bigstock, POSTGRES_DB: bigstock }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bigstock" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://bigstock:bigstock@localhost:5432/bigstock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
